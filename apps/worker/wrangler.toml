name = "wemail"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "local"
APP_NAME = "WeMail"
COOKIE_NAME = "wemail_session"
COOKIE_SECURE = "false"
CORS_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "wemail"
database_id = "local"
migrations_dir = "src/infrastructure/db/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "local-cache"
preview_id = "local-cache-preview"

[env.production]
workers_dev = false
routes = [
  { pattern = "wemail.biggoosehub.com/api/*", zone_name = "biggoosehub.com" }
]

[env.production.vars]
ENVIRONMENT = "production"
APP_NAME = "WeMail"
COOKIE_NAME = "wemail_session"
COOKIE_SECURE = "true"
CORS_ALLOWED_ORIGINS = "https://wemail.biggoosehub.com"
ADMIN_EMAILS = "ning@biggoosehub.com"
DEFAULT_MAIL_DOMAIN = "inbox.biggoosehub.com"
ENABLE_AI = "false"
ENABLE_TELEGRAM = "false"
ENABLE_OUTBOUND = "false"
ENABLE_MAILBOX_CREATION = "false"

[[env.production.d1_databases]]
binding = "DB"
database_name = "wemail-production"
database_id = "replace-with-production-d1-id"
migrations_dir = "src/infrastructure/db/migrations"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "replace-with-production-kv-id"
preview_id = "replace-with-production-kv-preview-id"

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
